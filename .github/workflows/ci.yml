name: checks
on: [push, pull_request]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --prefix backend
      - run: npm ci --prefix frontend
      # Role permissions on every route, grading, PDFs, validation. No database needed.
      - run: npm test --prefix backend
      # Every import resolves, every API address the pages call exists, every page renders for every role.
      - run: node scripts/check-frontend.mjs
      - run: node scripts/smoke-render.mjs
      - run: npm run build --prefix frontend
